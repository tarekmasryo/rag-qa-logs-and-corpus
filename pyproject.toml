[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragqa"
version = "0.1.0"
description = "Decision-grade RAG QA telemetry: validation + ops signals tooling"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Tarek Masryo"}]

dependencies = [
  "numpy",
  "pandas",
]

[project.optional-dependencies]
notebook = [
  "matplotlib",
  "seaborn",
  "scikit-learn",
]

dev = [
  "pytest",
  "ruff",
]

[project.scripts]
ragqa-validate = "ragqa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
